name: desktop-build

# Build the Keel desktop app (Electron + bundled Python backend) for macOS and
# Windows. PyInstaller can't cross-compile, so each OS builds its own sidecar on
# a native runner. Installers are uploaded as artifacts (v1 is unsigned).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkg: package:mac
          - os: windows-latest
            pkg: package:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Backend + CLI into the Python env so PyInstaller can freeze them.
      - name: Install Python backend + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ../agentic-cli
          pip install -e ../dashboard/backend
          pip install pyinstaller
          if [ "${{ runner.os }}" = "Windows" ]; then pip install pywinpty; fi

      - name: Install desktop deps
        run: npm install

      - name: Build & package
        run: npm run ${{ matrix.pkg }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: warn
