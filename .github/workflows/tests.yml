name: tests

# The Python suites, running as a blocking check for the first time.
#
# There was no such workflow because `main` carried 47 pre-existing failures and
# a blocking job would have gone red on arrival (see CLAUDE.md). Triage brought
# that to 28, all confined to the eight files excluded below, so the rest can
# now gate a pull request honestly.
#
# The exclusions are deliberate and visible. Excluding a file is a debt entry
# with a name attached; `continue-on-error` on the whole job would have hidden
# every future regression alongside the known ones, which is worse than not
# having CI at all.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "agentic-cli/**"
      - "dashboard/backend/**"
      - "dashboard/frontend/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentic-cli:
    name: agentic-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: agentic-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        working-directory: agentic-cli
        # Coverage is off here: the addopts in pyproject fail the run when the
        # plugin is absent, and a coverage number nobody reads is not worth a
        # slower gate. Excluded files are tracked in docs/KEELTRACE.md.
        run: |
          python -m pytest tests/ -q -o addopts="" \
            --ignore=tests/test_dashboard.py \
            --ignore=tests/test_context_builder.py \
            --ignore=tests/test_domain_context.py \
            --ignore=tests/test_eval_commands.py \
            --ignore=tests/test_external_registries.py \
            --ignore=tests/test_kg.py \
            --ignore=tests/test_project_commands.py \
            --ignore=tests/test_skill_evaluator.py \
            --ignore=tests/test_version.py

  dashboard-backend:
    name: dashboard/backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./agentic-cli
          pip install -e ./dashboard/backend
          pip install pytest
      - name: Test
        working-directory: dashboard/backend
        run: |
          python -m pytest tests/ -q -o addopts="" \
            --ignore=tests/test_neo4j_preflight.py \
            --ignore=tests/test_governance_api.py

  windows-cli-invocation:
    # A beachhead, not Windows coverage. Two bugs shipped because the dashboard
    # built its CLI command with POSIX assumptions and nothing ever ran on
    # Windows: `shlex` ate every backslash in a path, and the frozen sidecar's
    # `-m` fallback started a second backend. Both presented as success.
    #
    # Scoped to the tests that assert those two things because the rest of the
    # suite has never run on Windows and nobody has triaged what fails there —
    # a blanket job would go red on unrelated pre-existing breakage and get
    # ignored, which is worse than no job. Widening it is its own piece of work.
    name: windows / cli invocation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./agentic-cli
          pip install -e ./dashboard/backend
          pip install pytest
      - name: Test
        working-directory: dashboard/backend
        run: python -m pytest tests/test_cli_invocation.py -q -o addopts=""

  frontend:
    name: dashboard/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      # `npm ci` again, now that package-lock.json is committed. It installs the
      # resolved graph instead of re-resolving it, so an upstream release cannot
      # turn this job red on a day nothing here changed — which is the failure
      # `npm install` in CI quietly invites.
      - name: Install
        working-directory: dashboard/frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: dashboard/frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: dashboard/frontend
        run: npx vite build
