name: no-company-data

# Fails the build if any tracked file contains company-specific / internal data
# (company name, internal hostnames/usernames), secret formats, or forbidden
# data paths. Mirrors the local .githooks/pre-commit guard.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for company/internal data
        # Site-specific terms are injected from a repo secret so they are never
        # committed. If KEEL_GUARD_TERMS is unset (e.g. on a fork, where secrets
        # are not exposed), the scan still runs and enforces the generic
        # secret/key patterns — it just skips the site-specific terms.
        env:
          KEEL_GUARD_TERMS: ${{ secrets.KEEL_GUARD_TERMS }}
        run: bash scripts/check-no-company-data.sh --all
