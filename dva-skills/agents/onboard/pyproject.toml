[project]
name = "dva-onboard-agent"
version = "0.1.0"
description = "AI-powered onboard agent for skill gap detection and proposal generation"
requires-python = ">=3.10"
dependencies = [
    "dva-agentic-cli[agent]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
