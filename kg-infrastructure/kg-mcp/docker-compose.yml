services:
  kg-mcp-server:
    build: ./mcp-server
    container_name: keel-kg-mcp
    ports:
      - "8125:8125"  # MCP HTTP/SSE endpoint
    environment:
      # KG Provider Configuration
      - KG_PROVIDER=${KG_PROVIDER:-neo4j}
      
      # Neo4j Configuration
      - NEO4J_URI=${NEO4J_URI:-bolt://keel-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      
      # LightRAG Configuration
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://host.docker.internal:8001}
      
      # Vertex AI Configuration
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-}
      - GOOGLE_LOCATION=${GOOGLE_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/root/.config/gcloud/application_default_credentials.json}
      - VERTEX_AI_MODEL=${VERTEX_AI_MODEL:-gemini-1.5-flash}
      
      # MCP Server Configuration
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_PORT=${MCP_PORT:-8125}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    
    volumes:
      # Mount KEEL config (read-only)
      - ~/.keel-agentic:/root/.keel-agentic:ro
      # Mount Google Cloud credentials (read-only)
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # Mount entire agentic_cli package (runtime - reflects code changes)
      - ../keel-agentic-cli/src/agentic_cli:/app/agentic_cli:ro
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8125/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    restart: unless-stopped
    
    networks:
      - keel-network

networks:
  keel-network:
    external: true
    name: keel-network
