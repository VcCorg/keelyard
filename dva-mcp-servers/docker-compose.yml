# Unified MCP Services Stack
# Usage: docker compose up -d
#
# Services:
#   - bitbucket-mcp: Bitbucket Server PR review tools (port 8126)
#   - glean-mcp: Glean enterprise search & AI assistants (port 8127)
#   - jira-mcp: Jira Server issue tracking tools (port 8128)
#   - confluence-mcp: Confluence Server wiki & docs tools (port 8129)
#   - memory-mcp: Neo4j agent memory (3 memory types, 16 tools) (port 8130)
#   - kg-mcp: Knowledge graph business context & requirements (port 8131)
#   - mcp-gateway: Unified gateway aggregating all tools (port 9090)
#   - mcp-proxy: Alternative gateway using mcp-proxy named servers (port 9091)
#
# All services expose SSE endpoints for tool-agnostic access
# from Windsurf, OpenCode, Claude Desktop, or any MCP client.

services:
  bitbucket-mcp:
    build: ./bitbucket
    container_name: dva-bitbucket-mcp
    ports:
      - "8126:8126"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8126
      - BITBUCKET_SERVER_URL=${BITBUCKET_SERVER_URL:-https://bitbucket.example.com}
      - BITBUCKET_PERSONAL_ACCESS_TOKEN=${BITBUCKET_PERSONAL_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8126/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dva-network

  glean-mcp:
    build: ./glean
    container_name: dva-glean-mcp
    ports:
      - "8127:8127"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8127
      - GLEAN_API_TOKEN=${GLEAN_API_TOKEN}
      - GLEAN_DOMAIN=${GLEAN_DOMAIN:-https://example-production-be.glean.com}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8127/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dva-network

  confluence-mcp:
    build: ./confluence
    container_name: dva-confluence-mcp
    ports:
      - "8129:8129"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8129
      - CONFLUENCE_SERVER_URL=${CONFLUENCE_SERVER_URL:-https://confluence.example.com}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_DEFAULT_SPACE=${CONFLUENCE_DEFAULT_SPACE:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8129/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dva-network

  jira-mcp:
    build: ./jira
    container_name: dva-jira-mcp
    ports:
      - "8128:8128"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8128
      - JIRA_SERVER_URL=${JIRA_SERVER_URL:-https://jira.example.com}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - JIRA_DEFAULT_PROJECT=${JIRA_DEFAULT_PROJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8128/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dva-network

  memory-mcp:
    build: ./memory
    container_name: dva-memory-mcp
    ports:
      - "8130:8130"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://dva-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8130/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dva-network

  kg-mcp:
    build: ./kg
    container_name: dva-kg-mcp-new
    ports:
      - "8131:8131"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8131
      - KG_NEO4J_URI=${NEO4J_URI:-bolt://dva-neo4j:7687}
      - KG_NEO4J_USER=${NEO4J_USER:-neo4j}
      - KG_NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - KG_LIGHTRAG_URL=${KG_LIGHTRAG_URL:-http://dva-lightrag:8001}
      - KG_DEFAULT_PROVIDER=${KG_DEFAULT_PROVIDER:-lightrag}
      - KG_SOURCE_REGISTRY_PATH=/root/.dva-agentic/config.json
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN:-}
    volumes:
      - ${HOME}/.dva-agentic:/root/.dva-agentic:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8131/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dva-network

  mcp-gateway:
    build: ./gateway
    container_name: dva-mcp-gateway
    ports:
      - "9090:9090"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=9090
      - MCP_UPSTREAM_BITBUCKET=http://bitbucket-mcp:8126/sse
      - MCP_UPSTREAM_JIRA=http://jira-mcp:8128/sse
      - MCP_UPSTREAM_GLEAN=http://glean-mcp:8127/sse
      - MCP_UPSTREAM_CONFLUENCE=http://confluence-mcp:8129/sse
      - MCP_UPSTREAM_MEMORY=http://memory-mcp:8130/sse
      - MCP_UPSTREAM_KG=http://kg-mcp:8131/sse
    depends_on:
      bitbucket-mcp:
        condition: service_healthy
      jira-mcp:
        condition: service_healthy
      glean-mcp:
        condition: service_healthy
      confluence-mcp:
        condition: service_healthy
      memory-mcp:
        condition: service_healthy
      kg-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:9090/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dva-network

  mcp-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: dva-mcp-proxy
    ports:
      - "9091:9091"
    environment:
      - BITBUCKET_SERVER_URL=${BITBUCKET_SERVER_URL:-https://bitbucket.example.com}
      - BITBUCKET_PERSONAL_ACCESS_TOKEN=${BITBUCKET_PERSONAL_ACCESS_TOKEN}
      - JIRA_SERVER_URL=${JIRA_SERVER_URL:-https://jira.example.com}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:9091/servers/bitbucket/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dva-network

networks:
  dva-network:
    external: true
    name: dva-network
