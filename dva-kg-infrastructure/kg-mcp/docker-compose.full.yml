services:
  # MCP Server
  kg-mcp-server:
    build: ./mcp-server
    container_name: dva-kg-mcp
    ports:
      - "8125:8125"
    environment:
      - KG_PROVIDER=${KG_PROVIDER:-neo4j}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - LIGHTRAG_URL=http://lightrag:8001
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-}
      - GOOGLE_LOCATION=${GOOGLE_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - VERTEX_AI_MODEL=${VERTEX_AI_MODEL:-gemini-1.5-flash}
      - MCP_TRANSPORT=http
      - MCP_PORT=8125
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    volumes:
      - ~/.dva-agentic:/root/.dva-agentic:ro
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # Mount KG modules from CLI (runtime - reflects code changes)
      - ../dva-agentic-cli/src/dva_agentic_cli/kg:/app/src/kg:ro
    depends_on:
      neo4j:
        condition: service_healthy
      lightrag:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8125/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dva-network

  # Neo4j Database
  neo4j:
    image: neo4j:5.14-community
    container_name: dva-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_transaction_timeout=30s
      - NEO4J_dbms_lock_acquisition_timeout=30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dva-network

  # LightRAG Service
  lightrag:
    image: python:3.11-slim
    container_name: dva-lightrag
    working_dir: /app
    ports:
      - "8001:8001"
    environment:
      - LIGHTRAG_WORKING_DIR=/data/lightrag
      - LIGHTRAG_LOG_LEVEL=${LIGHTRAG_LOG_LEVEL:-INFO}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-}
      - GOOGLE_LOCATION=${GOOGLE_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - VERTEX_AI_MODEL=${VERTEX_AI_MODEL:-gemini-1.5-flash}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - VECTOR_STORE=${VECTOR_STORE:-nano-vectordb}
      - GRAPH_STORE=${GRAPH_STORE:-networkx}
      - MAX_ASYNC_WORKERS=${MAX_ASYNC_WORKERS:-4}
      - MAX_TOKENS=${MAX_TOKENS:-32768}
      - MAX_EMBED_TOKENS=${MAX_EMBED_TOKENS:-8192}
    volumes:
      - lightrag_data:/data
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -c "
        apt-get update && apt-get install -y curl &&
        pip install --no-cache-dir lightrag-hku fastapi uvicorn httpx google-cloud-aiplatform google-auth &&
        python -c 'from lightrag import LightRAG; import uvicorn; from fastapi import FastAPI; app = FastAPI(); rag = LightRAG(working_dir=\"/data/lightrag\"); @app.get(\"/health\"); async def health(): return {\"status\": \"healthy\"}; @app.post(\"/query\"); async def query(text: str): return await rag.aquery(text); uvicorn.run(app, host=\"0.0.0.0\", port=8001)'
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dva-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  lightrag_data:
    driver: local

networks:
  dva-network:
    driver: bridge
