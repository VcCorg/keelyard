[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Unified MCP Gateway - aggregates multiple MCP servers behind a single SSE endpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-gateway = "mcp_gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
