# Unified MCP Services Stack
# Usage: docker compose up -d
#
# Services:
#   - bitbucket-mcp: Bitbucket Server PR review tools (port 8126)
#   - glean-mcp: Glean enterprise search & AI assistants (port 8127)
#   - jira-mcp: Jira Server issue tracking tools (port 8128)
#   - confluence-mcp: Confluence Server wiki & docs tools (port 8129)
#   - memory-mcp: Neo4j agent memory (3 memory types, 16 tools) (port 8130)
#   - kg-mcp: Knowledge graph business context & requirements (port 8131)
#   - agentic-mcp: Agentic Platform central tracker & domain tools (port 8132)
#   - mcp-gateway: Unified gateway aggregating all tools (port 9090)
#   - mcp-proxy: Alternative gateway using mcp-proxy named servers (port 9091)
#
# All services expose SSE endpoints for tool-agnostic access
# from Windsurf, OpenCode, Claude Desktop, or any MCP client.

services:
  bitbucket-mcp:
    build: ./bitbucket
    container_name: keel-bitbucket-mcp
    ports:
      - "8126:8126"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8126
      - BITBUCKET_SERVER_URL=${BITBUCKET_SERVER_URL:-https://bitbucket.example.com}
      - BITBUCKET_PERSONAL_ACCESS_TOKEN=${BITBUCKET_PERSONAL_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8126/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  glean-mcp:
    build: ./glean
    container_name: keel-glean-mcp
    ports:
      - "8127:8127"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8127
      - GLEAN_API_TOKEN=${GLEAN_API_TOKEN:-}
      - GLEAN_DOMAIN=${GLEAN_DOMAIN:-https://example-production-be.glean.com}
      # SSO (OAuth client-credentials) mode — used when GLEAN_AUTH_MODE=sso.
      - GLEAN_AUTH_MODE=${GLEAN_AUTH_MODE:-token}
      - GLEAN_OAUTH_ISSUER=${GLEAN_OAUTH_ISSUER:-}
      - GLEAN_OAUTH_CLIENT_ID=${GLEAN_OAUTH_CLIENT_ID:-}
      - GLEAN_OAUTH_CLIENT_SECRET=${GLEAN_OAUTH_CLIENT_SECRET:-}
      - GLEAN_OAUTH_SCOPE=${GLEAN_OAUTH_SCOPE:-}
      - GLEAN_OAUTH_TOKEN_URL=${GLEAN_OAUTH_TOKEN_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8127/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  confluence-mcp:
    build: ./confluence
    container_name: keel-confluence-mcp
    ports:
      - "8129:8129"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8129
      - CONFLUENCE_SERVER_URL=${CONFLUENCE_SERVER_URL:-https://confluence.example.com}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_DEFAULT_SPACE=${CONFLUENCE_DEFAULT_SPACE:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8129/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  jira-mcp:
    build: ./jira
    container_name: keel-jira-mcp
    ports:
      - "8128:8128"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8128
      - JIRA_SERVER_URL=${JIRA_SERVER_URL:-https://jira.example.com}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - JIRA_DEFAULT_PROJECT=${JIRA_DEFAULT_PROJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8128/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  memory-mcp:
    build: ./memory
    container_name: keel-memory-mcp
    ports:
      - "8130:8130"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://keel-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8130/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keel-network

  kg-mcp:
    build: ./kg
    container_name: keel-kg-mcp-new
    ports:
      - "8131:8131"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8131
      - KG_NEO4J_URI=${NEO4J_URI:-bolt://keel-neo4j:7687}
      - KG_NEO4J_USER=${NEO4J_USER:-neo4j}
      - KG_NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - KG_LIGHTRAG_URL=${KG_LIGHTRAG_URL:-http://keel-lightrag:8001}
      - KG_DEFAULT_PROVIDER=${KG_DEFAULT_PROVIDER:-lightrag}
      - KG_SOURCE_REGISTRY_PATH=/root/.keel-agentic/config.json
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN:-}
    volumes:
      - ${HOME}/.keel-agentic:/root/.keel-agentic:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8131/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  agentic-mcp:
    build: ./agentic
    container_name: keel-agentic-mcp
    ports:
      - "8132:8132"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8132
      - MCP_HOST=0.0.0.0
      - AGENTIC_TRACKER_DB=/data/tracker.db
      - SKILLS_REGISTRY_PATH=/app/skills/registry.json
      - SKILLS_DIR=/app/skills/skills
    volumes:
      - ${HOME}/.agent-cli-agentic:/data
      - ../skills:/app/skills:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:8132/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keel-network

  mcp-gateway:
    build: ./gateway
    container_name: keel-mcp-gateway
    ports:
      - "9090:9090"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=9090
      - MCP_UPSTREAM_BITBUCKET=http://bitbucket-mcp:8126/sse
      - MCP_UPSTREAM_JIRA=http://jira-mcp:8128/sse
      - MCP_UPSTREAM_GLEAN=http://glean-mcp:8127/sse
      - MCP_UPSTREAM_CONFLUENCE=http://confluence-mcp:8129/sse
      - MCP_UPSTREAM_MEMORY=http://memory-mcp:8130/sse
      - MCP_UPSTREAM_KG=http://kg-mcp:8131/sse
      - MCP_UPSTREAM_AGENTIC=http://agentic-mcp:8132/sse
    depends_on:
      bitbucket-mcp:
        condition: service_healthy
      jira-mcp:
        condition: service_healthy
      glean-mcp:
        condition: service_healthy
      confluence-mcp:
        condition: service_healthy
      memory-mcp:
        condition: service_healthy
      kg-mcp:
        condition: service_healthy
      agentic-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:9090/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keel-network

  mcp-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: keel-mcp-proxy
    ports:
      - "9091:9091"
    environment:
      - BITBUCKET_SERVER_URL=${BITBUCKET_SERVER_URL:-https://bitbucket.example.com}
      - BITBUCKET_PERSONAL_ACCESS_TOKEN=${BITBUCKET_PERSONAL_ACCESS_TOKEN}
      - JIRA_SERVER_URL=${JIRA_SERVER_URL:-https://jira.example.com}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s http://localhost:9091/servers/bitbucket/sse > /dev/null 2>&1; test $$? -eq 28"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keel-network

networks:
  keel-network:
    external: true
    name: keel-network
